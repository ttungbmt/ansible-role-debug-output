---
galaxy_info:
  namespace: ttungbmt
  role_name: debug_output
  author: Truong Thanh Tung
  description: >
    Generate comprehensive debug reports for Ansible deployments with advanced
    filtering capabilities. Outputs per-host and inventory-wide reports in YAML
    format, including variables, facts, environment, and configuration details.
    Reduces output size by up to 94% with intelligent facts filtering.
  company: Personal
  license: MIT

  min_ansible_version: "2.9"

  platforms:
    - name: EL
      versions:
        - "7"
        - "8"
        - "9"
    - name: Ubuntu
      versions:
        - focal
        - jammy
        - noble
    - name: Debian
      versions:
        - buster
        - bullseye
        - bookworm
    - name: Fedora
      versions:
        - "38"
        - "39"
        - "40"

  galaxy_tags:
    - debug
    - troubleshooting
    - inventory
    - variables
    - diagnostics
    - validation
    - reporting
    - facts
    - monitoring
    - ansible

dependencies: []

