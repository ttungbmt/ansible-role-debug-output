---
# This task file generates detailed debug reports for Ansible deployments.
# It writes per-host files containing filtered variables and facts for each host,
# and inventory-wide files containing inventory graphs, group listings, and optionally all hostvars.
# Based on the design pattern from ttungbmt/ansible-role-debug-output

# Step 0: Clean output directories (run once, optional)
- name: Clean output directories before generating new reports
  ansible.builtin.shell:
    cmd: |
      rm -f {{ debug_output_dir }}/hosts/* 2>/dev/null || true
      rm -f {{ debug_output_dir }}/inventory/* 2>/dev/null || true
  delegate_to: localhost
  run_once: true
  when: debug_clean_output_dir | bool
  changed_when: false

# Step 1: Create output directories (run once)
- name: Ensure output directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ debug_output_dir }}"
    - "{{ debug_output_dir }}/inventory"
    - "{{ debug_output_dir }}/hosts"
  delegate_to: localhost
  run_once: true

# Step 2: Determine the inventory file being used.
# This uses the first entry from ansible_inventory_sources or falls back to inventory_file/default.
- name: Detect inventory source
  ansible.builtin.set_fact:
    inventory_src: >-
      {{
        (ansible_inventory_sources | default([]) | first)
        | default(inventory_file | default(debug_inventory_file | default('hosts.yml')))
      }}
  run_once: true

# Step 3: Run the ansible-inventory command to capture the full inventory list.
# This command is run on localhost and only once for the whole play.
- name: Run ansible-inventory --list (inventory-wide)
  ansible.builtin.command:
    cmd: ansible-inventory -i {{ inventory_src }} --list --yaml
  register: inventory_list_cmd
  changed_when: false
  delegate_to: localhost
  run_once: true

# Step 4: Run the ansible-inventory command to capture the inventory graph.
- name: Run ansible-inventory --graph (inventory-wide)
  ansible.builtin.command:
    cmd: ansible-inventory -i {{ inventory_src }} --graph
  register: inventory_graph_cmd
  changed_when: false
  delegate_to: localhost
  run_once: true

# -------- PER-HOST SECTION (runs once per host) --------

# Use ansible-inventory command to dump host variables without template evaluation
- name: Get host variables using ansible-inventory
  ansible.builtin.command:
    cmd: ansible-inventory -i {{ inventory_src }} --host {{ inventory_hostname }} --yaml
  register: host_vars_cmd
  changed_when: false
  delegate_to: localhost

# Apply advanced filtering to host variables
# Note: We keep the original YAML string and only parse/filter if needed
- name: Set default host vars (no filtering)
  ansible.builtin.set_fact:
    host_vars_yaml: "{{ host_vars_cmd.stdout }}"
    host_vars_filtered: "{{ host_vars_cmd.stdout | from_yaml }}"
  delegate_to: localhost

# If include_keys is specified, only include those keys
- name: Filter variables - include only specified keys
  ansible.builtin.set_fact:
    host_vars_filtered: >-
      {{
        host_vars_filtered | dict2items
        | selectattr('key', 'in', debug_include_keys)
        | items2dict
      }}
    host_vars_yaml: >-
      {{
        (host_vars_filtered | dict2items
        | selectattr('key', 'in', debug_include_keys)
        | items2dict) | to_nice_yaml
      }}
  when: debug_include_keys | length > 0
  delegate_to: localhost

# If include_keys is NOT specified, apply default exclude_keys
- name: Filter variables - exclude default keys
  ansible.builtin.set_fact:
    host_vars_filtered: >-
      {{
        host_vars_filtered | dict2items
        | rejectattr('key', 'in', debug_exclude_keys)
        | items2dict
      }}
    host_vars_yaml: >-
      {{
        (host_vars_filtered | dict2items
        | rejectattr('key', 'in', debug_exclude_keys)
        | items2dict) | to_nice_yaml
      }}
  when: debug_include_keys | length == 0
  delegate_to: localhost

# Apply include patterns (additive - adds more variables)
- name: Apply include patterns
  ansible.builtin.set_fact:
    host_vars_filtered: >-
      {{
        host_vars_filtered | combine(
          (host_vars_cmd.stdout | from_yaml) | dict2items
          | selectattr('key', 'match', debug_include_patterns | join('|'))
          | items2dict
        )
      }}
  when: debug_include_patterns | length > 0
  delegate_to: localhost

# Apply exclude patterns (subtractive - removes variables)
- name: Apply exclude patterns
  ansible.builtin.set_fact:
    host_vars_filtered: >-
      {{
        host_vars_filtered | dict2items
        | rejectattr('key', 'match', debug_exclude_patterns | join('|'))
        | items2dict
      }}
  when: debug_exclude_patterns | length > 0
  delegate_to: localhost

# Update YAML representation if patterns were applied
- name: Update YAML representation after pattern filtering
  ansible.builtin.set_fact:
    host_vars_yaml: "{{ host_vars_filtered | to_nice_yaml }}"
  when: (debug_include_patterns | length > 0) or (debug_exclude_patterns | length > 0)
  delegate_to: localhost

# Write the per-host report in YAML format
- name: Write per-host report
  ansible.builtin.template:
    src: per_host_report.yaml.j2
    dest: "{{ debug_output_dir }}/hosts/{{ inventory_hostname }}.yaml"
  delegate_to: localhost

# -------- INVENTORY-WIDE SECTION (run once) --------

# Write the groups dictionary to YAML file
- name: Write groups map (inventory-wide)
  ansible.builtin.copy:
    content: "{{ groups | to_nice_yaml }}"
    dest: "{{ debug_output_dir }}/inventory/groups.yaml"
  delegate_to: localhost
  run_once: true

# Write the inventory graph from the command to a plain text file.
- name: Write inventory graph (inventory-wide)
  ansible.builtin.copy:
    content: "{{ inventory_graph_cmd.stdout }}"
    dest: "{{ debug_output_dir }}/inventory/inventory_graph.txt"
  delegate_to: localhost
  run_once: true

# Write the full inventory list from the command to a YAML file.
- name: Write inventory list (inventory-wide)
  ansible.builtin.copy:
    content: "{{ inventory_list_cmd.stdout }}"
    dest: "{{ debug_output_dir }}/inventory/inventory_list.yaml"
  delegate_to: localhost
  run_once: true

# Optionally write all hostvars to a YAML file. This file may be large and is written only if enabled.
# Note: This uses the output from ansible-inventory --list which already contains all hostvars.
# This is essentially a duplicate of inventory_list.yaml but kept for backward compatibility.
- name: Write hostvars for all hosts (inventory-wide)
  ansible.builtin.copy:
    content: "{{ inventory_list_cmd.stdout }}"
    dest: "{{ debug_output_dir }}/inventory/hostvars_all.yaml"
  when: debug_write_inventory_hostvars | bool
  delegate_to: localhost
  run_once: true

# Write an inventory metadata report with references to generated files.
- name: Write INVENTORY_REPORT (inventory metadata)
  ansible.builtin.copy:
    content: |
      ====== INVENTORY METADATA ======
      inventory_src: {{ inventory_src }}
      ansible_inventory_sources: {{ ansible_inventory_sources | default([]) | to_nice_yaml }}
      ansible_config_file: {{ ansible_config_file | default('N/A') }}
      ansible_version: {{ ansible_version.full }}
      output_format: YAML

      ====== CONFIGURATION ======
      Output format: YAML
      Report sections: {{ debug_report_sections if debug_report_sections != 'all' else 'all (default)' }}
      {% if debug_include_keys | length > 0 %}
      Include keys: {{ debug_include_keys | join(', ') }}
      {% else %}
      Exclude keys: {{ debug_exclude_keys | join(', ') }}
      {% endif %}
      {% if debug_include_patterns | length > 0 %}
      Include patterns: {{ debug_include_patterns | join(', ') }}
      {% endif %}
      {% if debug_exclude_patterns | length > 0 %}
      Exclude patterns: {{ debug_exclude_patterns | join(', ') }}
      {% endif %}

      ====== FILES GENERATED ======
      - {{ debug_output_dir }}/inventory/groups.yaml
      - {{ debug_output_dir }}/inventory/inventory_list.yaml
      {% if debug_write_inventory_hostvars | bool %}
      - {{ debug_output_dir }}/inventory/hostvars_all.yaml
      {% endif %}
      - {{ debug_output_dir }}/inventory/inventory_graph.txt
      - {{ debug_output_dir }}/hosts/<inventory_hostname>.yaml (per host)

      ====== USAGE ======
      To inspect a specific host:
        cat {{ debug_output_dir }}/hosts/<hostname>.yaml

      To view inventory-wide information:
        cat {{ debug_output_dir }}/inventory/INVENTORY_REPORT.yaml
        cat {{ debug_output_dir }}/inventory/groups.yaml
        cat {{ debug_output_dir }}/inventory/inventory_graph.txt
    dest: "{{ debug_output_dir }}/inventory/INVENTORY_REPORT.yaml"
  delegate_to: localhost
  run_once: true

# Display summary message
- name: Display debug output summary
  ansible.builtin.debug:
    msg: |
      ==========================================
      Debug Output Generated (v1.2.0)
      ==========================================
      Output directory: {{ debug_output_dir }}
      Output format: YAML

      Per-host reports: {{ debug_output_dir }}/hosts/
      Inventory-wide reports: {{ debug_output_dir }}/inventory/

      View inventory summary:
        cat {{ debug_output_dir }}/inventory/INVENTORY_REPORT.yaml

      View host-specific report:
        cat {{ debug_output_dir }}/hosts/{{ inventory_hostname }}.yaml
      ==========================================
  run_once: true

